[project]
name = "hello-python"
version = "0.1.0"
description = "A small reading-list CLI for learning modern Python development"
readme = "README.md"
requires-python = "==3.15.1"
dependencies = [
    "pydantic==2.13.4",
]

[project.scripts]
hello-python = "hello_python.cli:run"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
